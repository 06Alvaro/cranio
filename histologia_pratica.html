<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Microscópio Virtual</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
display:flex;
gap:40px;
align-items:center;
}

.painel{
display:flex;
flex-direction:column;
gap:15px;
}

#microscopio{
width:500px;
height:500px;
border-radius:50%;
overflow:hidden;
border:15px solid black;
box-shadow:0 0 50px black inset;
position:relative;
touch-action:none;
}

#imagem{
position:absolute;
width:2300px;
cursor:grab;
user-select:none;
}

button{
padding:10px;
border:none;
border-radius:8px;
background:#ff2a2a;
color:white;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#ff4444;
}

input{
padding:10px;
border-radius:8px;
border:none;
width:300px;
}

#sugestoes{
background:white;
color:black;
border-radius:8px;
width:300px;
max-height:150px;
overflow-y:auto;
}

.opcao{
padding:8px;
cursor:pointer;
}

.opcao:hover{
background:#eee;
}

#resultado{
font-weight:bold;
}
</style>

</head>

<body>

<div class="container">

<div class="painel">

<h2>🔬 Identifique o tecido</h2>

<div>
Zoom:
<button onclick="zoom(1)">4x</button>
<button onclick="zoom(1.5)">10x</button>
<button onclick="zoom(2)">40x</button>
<button onclick="zoom(3)">100x</button>
</div>

<div>
Foco:
<input type="range" min="0" max="10" value="5" id="foco">
</div>

<input type="text" id="resposta" placeholder="Digite o tecido...">
<div id="sugestoes"></div>

<button onclick="verificar()">Verificar</button>
<button onclick="mostrarResposta()">Mostrar resposta</button>
<button onclick="proxima()">Próxima lâmina</button>
<button onclick="voltar()">⬅ Voltar lâmina</button>

<div id="resultado"></div>

</div>

<div id="microscopio">
<img id="imagem">
</div>

</div>

<script>

let img = document.getElementById("imagem")
let foco = document.getElementById("foco")
let sugestoesDiv = document.getElementById("sugestoes")
let input = document.getElementById("resposta")
let resultado = document.getElementById("resultado")

let escala = 1
let posX = 0
let posY = 0

let imagens = [
"glandula_endocrina_do_tipo_folicular",
"tecido_epitelial_de_revestimento_cilindrico_pseudoestratificado_com_estereocilios_ducto_deferente",
"tecido_epitelial_de_revestimento_cilindrico_pseudoestratificado_com_estereocilios_e_tecido_epitelial_de_revestimento_cilindrico_simples_com_estereocilios_epididimo",
"tecido_epitelial_de_revestimento_cilindrico_simples_ciliado_e_tecido_epitelial_de_revestimento_cilindrico_pseudoestratificado_ciliado_traqueia",
"tecido_epitelial_de_revestimento_cilindrico_simples_ciliado_e_tecido_epitelial_de_revestimento_cilindrico_pseudoestratificado_ciliado_tuba_uterina",
"tecido_epitelial_de_revestimento_cilindrico_simples_com_microvilos_jejuno",
"tecido_epitelial_de_revestimento_cilindrico_simples_com_microvilos_reto",
"tecido_epitelial_de_revestimento_cilindrico_simples_estomago",
"tecido_epitelial_de_revestimento_cubico_estratificado_ovario",
"tecido_epitelial_de_revestimento_cubico_simples_ovario",
"tecido_epitelial_de_revestimento_cubico_simples_rim",
"tecido_epitelial_glandular_com_acinos_serosos_pancreas",
"tecido_epitelial_de_revestimento_pavimentoso_simples_rim",
"tecido_epitelial_de_revestimento_pavimentoso_simples_ovario",
"tecido_epitelial_de_revestimento_pavimentoso_estratificado_queratinizado_de_pele_espessa_pele_de_polpa_digital",
"tecido_epitelial_de_revestimento_pavimentoso_estratificado_queratinizado_de_pele_delgada_labio",
"tecido_epitelial_de_revestimento_pavimentoso_estratificado_nao_queratinizado_labio",
"tecido_epitelial_de_revestimento_pavimentoso_estratificado_nao_queratinizado_esofago",
"tecido_epitelial_de_revestimento_de_transição_ureter",
"tecido_epitelial_de_revestimento_de_transição_bexiga_vazia",
"tecido_epitelial_de_revestimento_de_transição_bexiga_cheia",
"tecido_epitelial_de_revestimento_cubico_simples_tireoide",
"tecido_epitelial_glandular_glandula_acinosa_ramificada_simples_glandula_sebacia_labio",
"tecido_epitelial_glandular_glandula_acinosa_ramificada_simples_pele",
"tecido_epitelial_glandular_glandula_tubulo_acinosa_composta_glandula_sublingual",
"tecido_epitelial_glandular_glandula_tubulo_acinosa_composta_glandula_submandibular",
"tecido_epitelial_glandular_glandula_tubulo_alveolar_composta_glandula_mamaria",
"tecido_epitelial_glandular_glandula_tubulo_enovelada_simples_glandula_sudoripara_pele_de_polpa_digital",
"tecido_epitelial_glandular_glandulas_tubulo_alveolares_compostas_prostata",
"tecido_epitelial_glandular_glandulas_tubulosas_ramificadas_estomago",
"tecido_epitelial_glandular_glandulas_tubulosas_ramificadas_simples_utero_fase_secretora",
"tecido_epitelial_glandular_glandulas_tubulosas_simples_ileo",
"tecido_epitelial_glandular_glandulas_tubulosas_simples_jejuno",
"tecido_epitelial_glandular_glandulas_tubulosas_simples_reto",
"tecido_epitelial_glandular_glandulas_tubulosas_simples_utero_fase_proliferativa",
"tecido_epitelial_glandular_ilhota_de_langerhans_glandula_endocrina_do_tipo_cordonal_pancreas",
]

function embaralhar(array){
for(let i=array.length-1;i>0;i--){
let j=Math.floor(Math.random()*(i+1))
let temp=array[i]
array[i]=array[j]
array[j]=temp
}
}

embaralhar(imagens)

let atual = 0
let historico = []

function normalizar(texto){
return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replaceAll(" ","_")
}

function carregarImagem(){
img.src = imagens[atual] + ".png"
img.onerror = ()=>{ img.src = imagens[atual] + ".jpg" }

input.value=""
sugestoesDiv.innerHTML=""
resultado.innerText=""

escala = 1

img.onload = () => {

let larguraImg = img.clientWidth
let alturaImg = img.clientHeight

let box = document.getElementById("microscopio")

let larguraBox = box.clientWidth
let alturaBox = box.clientHeight

posX = (larguraBox - larguraImg * escala) / 2
posY = (alturaBox - alturaImg * escala) / 2

img.style.transform = `scale(${escala}) translate(${posX}px, ${posY}px)`
}
}

function proxima(){
historico.push(atual)
atual++
if(atual>=imagens.length){
embaralhar(imagens)
atual=0
}
carregarImagem()
}

function voltar(){
if(historico.length>0){
atual=historico.pop()
carregarImagem()
}
}

function zoom(valor){
escala=valor
img.style.transform=`scale(${escala}) translate(${posX}px, ${posY}px)`
}

foco.addEventListener("input", ()=>{
let blur=Math.abs(5-foco.value)
img.style.filter=`blur(${blur}px)`
})

function verificar(){
let respostaUsuario=normalizar(input.value)
let correta=normalizar(imagens[atual])

if(respostaUsuario===correta){
resultado.innerText="✅ Correto!"
resultado.style.color="lightgreen"
}else{
resultado.innerText="❌ Errado!"
resultado.style.color="red"
}
}

function mostrarResposta(){
resultado.innerText="💡 Resposta: "+imagens[atual].replaceAll("_"," ")
resultado.style.color="yellow"
}

input.addEventListener("input", ()=>{
let valor=normalizar(input.value)
sugestoesDiv.innerHTML=""
if(valor==="") return

imagens.filter(nome=>normalizar(nome).includes(valor))
.forEach(nome=>{
let div=document.createElement("div")
div.classList.add("opcao")
div.innerText=nome.replaceAll("_"," ")
div.onclick=()=>{
input.value=div.innerText
sugestoesDiv.innerHTML=""
}
sugestoesDiv.appendChild(div)
})
})

let arrastando=false
let startX,startY

img.addEventListener("mousedown",(e)=>{
arrastando=true
img.style.cursor="grabbing"
startX=e.clientX
startY=e.clientY
})

document.addEventListener("mouseup",()=>{
arrastando=false
img.style.cursor="grab"
})

document.addEventListener("mousemove",(e)=>{
if(arrastando){
let dx=(e.clientX-startX)/escala
let dy=(e.clientY-startY)/escala
posX+=dx
posY+=dy
posX=Math.max(-300,Math.min(300,posX))
posY=Math.max(-300,Math.min(300,posY))
img.style.transform=`scale(${escala}) translate(${posX}px, ${posY}px)`
startX=e.clientX
startY=e.clientY
}
})

img.addEventListener("touchstart",(e)=>{
arrastando=true
let touch=e.touches[0]
startX=touch.clientX
startY=touch.clientY
})

document.addEventListener("touchend",()=>{
arrastando=false
})

document.addEventListener("touchmove",(e)=>{
if(arrastando){
let touch=e.touches[0]
let dx=(touch.clientX-startX)/escala
let dy=(touch.clientY-startY)/escala
posX+=dx
posY+=dy
posX=Math.max(-300,Math.min(300,posX))
posY=Math.max(-300,Math.min(300,posY))
img.style.transform=`scale(${escala}) translate(${posX}px, ${posY}px)`
startX=touch.clientX
startY=touch.clientY
}
})

carregarImagem()

</script>

</body>
</html>
