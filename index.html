<!DOCTYPE html>

<html>
<head>
<meta charset="UTF-8">
<title>Atlas Interativo do Crânio</title>

<style>
body{
margin:0;
font-family:Segoe UI;
background:linear-gradient(135deg,#141e30,#243b55);
color:white;
display:flex;
flex-direction:column;
align-items:center;
padding-bottom:120px;
}

h1{margin-top:20px}

#views button{
margin:5px;
padding:10px;
border:none;
border-radius:6px;
background:#ff2a2a;
color:white;
cursor:pointer;
}

#game{
display:flex;
gap:30px;
margin-top:20px;
}

#container{position:relative}

.skullView{
position:relative;
display:none;
}

.skullView img{
width:520px;
border-radius:10px;
}

.marker{
position:absolute;
width:12px;
height:12px;
border-radius:50%;
background:#777;
border:2px solid white;
transform:translate(-50%,-50%);
}

.marker.acerto{background:red}

#painel{
display:flex;
flex-direction:column;
gap:15px;
}

.categoria{
width:230px;
background:#111;
padding:15px;
border-radius:8px;
}

.lista{
margin-top:10px;
max-height:120px;
overflow:auto;
}

.item{
padding:5px;
margin:4px 0;
background:#1f1f1f;
border-left:4px solid red;
border-radius:4px;
}

.item.revelado{
background:#333;
border-left:4px solid orange;
}

#inputArea{
position:fixed;
bottom:0;
left:0;
right:0;
background:#0f0f0f;
padding:15px;
display:flex;
justify-content:center;
gap:10px;
}

#input{
padding:12px;
font-size:16px;
width:260px;
border-radius:6px;
border:none;
}

button{
padding:12px;
border:none;
border-radius:6px;
background:#ff2a2a;
color:white;
font-weight:bold;
cursor:pointer;
}

#btnRespostas{
background:#444;
}

#mensagem{
margin-top:10px;
height:24px;
font-weight:bold;
text-align:center;
}
</style>

</head>

<body>

<h1></h1>

<div id="views">
<button onclick="trocarVista('frontal')">Frontal</button>
<button onclick="trocarVista('lateral')">Lateral</button>
<button onclick="trocarVista('inferior')">Inferior</button>
<button onclick="trocarVista('traseiro')">Posterior</button>
</div>

<div id="game">

<div id="container">

<div id="frontal" class="skullView">
<img src="skull.png">

<div class="marker" id="frontal_m" style="left:260px;top:110px"></div>
<div class="marker" id="nasal_m" style="left:260px;top:210px"></div>
<div class="marker" id="maxila_m" style="left:250px;top:280px"></div>
<div class="marker" id="mandibula_m" style="left:260px;top:420px"></div>

<div class="marker" id="lacrimal_m" style="left:295px;top:200px"></div>
<div class="marker" id="etmoide_m" style="left:260px;top:180px"></div>
<div class="marker" id="esfenoide_m" style="left:330px;top:220px"></div>
<div class="marker" id="vomer_m" style="left:260px;top:250px"></div>
<div class="marker" id="concha_m" style="left:280px;top:240px"></div>
<div class="marker" id="palatino_osso_m" style="left:260px;top:270px"></div>

<div class="marker" id="infraorbital_m" style="left:300px;top:260px"></div>
<div class="marker" id="supraorbital_m" style="left:260px;top:160px"></div>
<div class="marker" id="mental_m" style="left:260px;top:360px"></div>

<div class="marker" id="alveolar_m" style="left:260px;top:300px"></div>
</div>

<div id="lateral" class="skullView">
<img src="cranio-lateral.png">

<div class="marker" id="temporal_m" style="left:300px;top:250px"></div>
<div class="marker" id="parietal_m" style="left:310px;top:140px"></div>
<div class="marker" id="zigomatico_m" style="left:380px;top:270px"></div>

<div class="marker" id="mastoid_m" style="left:250px;top:320px"></div>
<div class="marker" id="estiloide_m" style="left:260px;top:310px"></div>

<div class="marker" id="coronoide_m" style="left:350px;top:310px"></div>
<div class="marker" id="condilar_m" style="left:300px;top:290px"></div>
</div>

<div id="inferior" class="skullView">
<img src="cranio-inferior.png">

<div class="marker" id="forame_magno_m" style="left:260px;top:300px"></div>
<div class="marker" id="forame_oval_m" style="left:330px;top:230px"></div>
<div class="marker" id="forame_espinhoso_m" style="left:350px;top:250px"></div>
<div class="marker" id="forame_redondo_m" style="left:310px;top:210px"></div>

<div class="marker" id="palatino_m" style="left:260px;top:170px"></div>
<div class="marker" id="pterigoide_m" style="left:300px;top:240px"></div>
</div>

<div id="traseiro" class="skullView">
<img src="cranio-traseiro.png">

<div class="marker" id="occipital_m" style="left:260px;top:220px"></div>
<div class="marker" id="mastoid2_m" style="left:320px;top:260px"></div>
</div>

</div>

<div id="painel">

<div class="categoria">
<h3>Ossos</h3>
<div id="count_ossos">0 / 14</div>
<div class="lista" id="lista_ossos"></div>
</div>

<div class="categoria">
<h3>Processos</h3>
<div id="count_processos">0 / 7</div>
<div class="lista" id="lista_processos"></div>
</div>

<div class="categoria">
<h3>Forames</h3>
<div id="count_forames">0 / 7</div>
<div class="lista" id="lista_forames"></div>
</div>

<div class="categoria">
<h3>Pontos Craniométricos</h3>
<div id="count_pontos">0 / 10</div>
<div class="lista" id="lista_pontos"></div>
</div>

</div>
</div>

<div id="mensagem"></div>

<div id="inputArea">
<input id="input" placeholder="Digite o nome da estrutura">
<button onclick="verificar()">OK</button>
<button id="btnRespostas" onclick="mostrarRespostas()">👁 Ver respostas</button>
</div>

<script>

function normalizar(t){
return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
}

function trocarVista(v){
document.querySelectorAll(".skullView").forEach(el=>el.style.display="none")
document.getElementById(v).style.display="block"
}

trocarVista("frontal")

let revelado=false

const estruturas={

frontal:{cat:"ossos",nomes:["frontal"],marker:"frontal_m"},
nasal:{cat:"ossos",nomes:["nasal"],marker:"nasal_m"},
maxila:{cat:"ossos",nomes:["maxila"],marker:"maxila_m"},
mandibula:{cat:"ossos",nomes:["mandibula"],marker:"mandibula_m"},
temporal:{cat:"ossos",nomes:["temporal"],marker:"temporal_m"},
parietal:{cat:"ossos",nomes:["parietal"],marker:"parietal_m"},
zigomatico:{cat:"ossos",nomes:["zigomatico"],marker:"zigomatico_m"},
occipital:{cat:"ossos",nomes:["occipital"],marker:"occipital_m"},

lacrimal:{cat:"ossos",nomes:["lacrimal"],marker:"lacrimal_m"},
etmoide:{cat:"ossos",nomes:["etmoide"],marker:"etmoide_m"},
esfenoide:{cat:"ossos",nomes:["esfenoide"],marker:"esfenoide_m"},
vomer:{cat:"ossos",nomes:["vomer","vômer"],marker:"vomer_m"},
concha_inferior:{cat:"ossos",nomes:["concha nasal inferior"],marker:"concha_m"},
palatino_osso:{cat:"ossos",nomes:["palatino"],marker:"palatino_osso_m"},

mastoide:{cat:"processos",nomes:["processo mastoide"],marker:"mastoid_m"},
estiloide:{cat:"processos",nomes:["processo estiloide"],marker:"estiloide_m"},
coronoide:{cat:"processos",nomes:["processo coronoide"],marker:"coronoide_m"},
condilar:{cat:"processos",nomes:["processo condilar"],marker:"condilar_m"},
alveolar:{cat:"processos",nomes:["processo alveolar"],marker:"alveolar_m"},
palatino:{cat:"processos",nomes:["processo palatino"],marker:"palatino_m"},
pterigoide:{cat:"processos",nomes:["processo pterigoide"],marker:"pterigoide_m"},

forame_magno:{cat:"forames",nomes:["forame magno"],marker:"forame_magno_m"},
forame_oval:{cat:"forames",nomes:["forame oval"],marker:"forame_oval_m"},
forame_espinhoso:{cat:"forames",nomes:["forame espinhoso"],marker:"forame_espinhoso_m"},
forame_redondo:{cat:"forames",nomes:["forame redondo"],marker:"forame_redondo_m"},
infraorbital:{cat:"forames",nomes:["forame infraorbital"],marker:"infraorbital_m"},
supraorbital:{cat:"forames",nomes:["forame supraorbital"],marker:"supraorbital_m"},
mental:{cat:"forames",nomes:["forame mental"],marker:"mental_m"},

nasion:{cat:"pontos",nomes:["nasion"]},
glabella:{cat:"pontos",nomes:["glabella"]},
bregma:{cat:"pontos",nomes:["bregma"]},
lambda:{cat:"pontos",nomes:["lambda"]},
pterion:{cat:"pontos",nomes:["pterion"]},
asterion:{cat:"pontos",nomes:["asterion"]},
gnathion:{cat:"pontos",nomes:["gnathion"]},
prosthion:{cat:"pontos",nomes:["prosthion"]},
opisthion:{cat:"pontos",nomes:["opisthion"]},
basion:{cat:"pontos",nomes:["basion"]}
}

let encontrados=new Set()

function adicionarLista(cat,nome,revelado=false){
let div=document.createElement("div")
div.className="item"
if(revelado){
div.classList.add("revelado")
div.innerText="📚 "+nome
}else{
div.innerText=nome
}
document.getElementById("lista_"+cat).appendChild(div)
}

function atualizar(){
let cont={ossos:0,processos:0,forames:0,pontos:0}
for(let k of encontrados){
cont[estruturas[k].cat]++
}
document.getElementById("count_ossos").innerText=cont.ossos+" / 14"
document.getElementById("count_processos").innerText=cont.processos+" / 7"
document.getElementById("count_forames").innerText=cont.forames+" / 7"
document.getElementById("count_pontos").innerText=cont.pontos+" / 10"
}

function verificar(){
let input=document.getElementById("input")
let valor=normalizar(input.value)
let msg=document.getElementById("mensagem")

for(let key in estruturas){
let e=estruturas[key]
for(let nome of e.nomes){
if(normalizar(nome)===valor){

if(encontrados.has(key)){
msg.innerText="⚠️ Já encontrado"
return
}

encontrados.add(key)

if(e.marker){
let m=document.getElementById(e.marker)
if(m) m.classList.add("acerto")
}

adicionarLista(e.cat,nome)
atualizar()

msg.innerText="✅ Correto!"
input.value=""
return
}
}
}

msg.innerText="❌ Estrutura não encontrada"
}

function mostrarRespostas(){

for(let key in estruturas){

if(!encontrados.has(key)){

let e=estruturas[key]

encontrados.add(key)

if(e.marker){
let m=document.getElementById(e.marker)
if(m) m.classList.add("acerto")
}

adicionarLista(e.cat,e.nomes[0],true)

}
}

atualizar()

document.getElementById("mensagem").innerText="📚 Todas as respostas reveladas"
}

document.getElementById("input").addEventListener("keydown",function(event){
if(event.key==="Enter"){
verificar()
}
})

</script>

</body>
</html>
